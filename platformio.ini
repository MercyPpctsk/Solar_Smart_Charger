; PlatformIO project for Waveshare ESP32-S3-ETH
; Onboard WS2812 RGB (NeoPixel) LED is on GPIO21.
; The board uses the ESP32-S3 built-in USB-Serial/JTAG (VID:PID 303A:1001) on COM14.

[env:esp32-s3-eth]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 16 MB flash on the ESP32-S3-ETH (W25Q128)
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; 16 MB partition layout (app 6.4 MB + ~3.4 MB SPIFFS for LittleFS logging).
; NVS stays at 0x9000 exactly like the previous default.csv, so the stored
; zero calibration survives this partition-table switch.
board_build.partitions = default_16MB.csv

; Flash + monitor over the native USB-Serial/JTAG.
; NOTE: the ESP32-S3 USB-CDC port re-enumerates and Windows assigns it a NEW
; COM number on each physical replug (here COM21). If upload fails with a
; "Write timeout" on a different COMn, that port is NOT the board - re-list the
; ports (USB Serial Device, VID:PID 303A:1001) and update these two lines.
upload_port = COM21
monitor_port = COM21
monitor_speed = 115200

; Route Serial to the built-in USB-Serial/JTAG so logs appear on COM14
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMQTT_MAX_PACKET_SIZE=1024

; ArduinoJson v7 for the IQAir client (JsonDocument elastic API).
; PubSubClient for ThingsBoard MQTT telemetry/attributes.
; neopixelWrite() ships with the ESP32 Arduino core (no lib needed).
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
